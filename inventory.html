<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #f4f7f6;
        padding: 20px;
        font-family: sans-serif;
      }
      .card-stat {
        border-left: 5px solid #0d6efd;
      }
      .inv-card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-between mb-3">
        <h4>📦 Inventory Part</h4>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Ke Kasir</a>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-6">
          <div class="card p-3 card-stat">
            <small class="text-muted">Dana Mengendap</small>
            <h5 id="totalModal" class="m-0 text-primary">Rp 0</h5>
          </div>
        </div>
        <div class="col-6">
          <div class="card p-3 border-start border-success border-5">
            <small class="text-muted">Total Stok</small>
            <h5 id="totalStok" class="m-0 text-success">0 Pcs</h5>
          </div>
        </div>
      </div>

      <div class="card p-3 mb-4">
        <form id="invForm">
          <input type="hidden" name="formType" value="inventory" />
          <input type="hidden" name="rowId" id="rowId" />
          <div class="mb-2">
            <input type="text" name="namaPart" id="namaPart" class="form-control" placeholder="Nama Part" required />
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6"><input type="number" name="hargaBeli" id="hargaBeli" class="form-control" placeholder="Harga Beli" required /></div>
            <div class="col-6"><input type="number" name="hargaJual" id="hargaJual" class="form-control" placeholder="Harga Jual" /></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6"><input type="number" name="stok" id="stok" class="form-control" placeholder="Jumlah Stok" required /></div>
            <div class="col-6"><input type="text" name="kategori" id="kategori" class="form-control" placeholder="Kategori" /></div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Simpan ke Gudang</button>
        </form>
      </div>

      <div id="inventoryList">Loading data...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      const scriptURL = "https://script.google.com/macros/s/AKfycbzrHvS3gYlGYNre63RN5Z2umoQ4_B2h3D_TaRBINkM26qx7qG69hI8awRzlRCEr64HI/exec";

      function loadInv() {
        fetch(scriptURL + "?action=getInventory")
          .then((r) => r.json())
          .then((data) => {
            let html = "";
            let totalM = 0;
            let totalS = 0;
            data.forEach((d) => {
              let mengendap = d.beli * d.stok;
              totalM += mengendap;
              totalS += d.stok;
              html += `
            <div class="inv-card">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <strong class="d-block">${d.nama}</strong>
                  <small class="text-muted">Stok: ${d.stok} | Modal: Rp ${d.beli.toLocaleString()}</small>
                  <div class="mt-1"><span class="badge bg-light text-dark border">Dana: Rp ${mengendap.toLocaleString()}</span></div>
                </div>
                <div class="text-end">
                  <button class="btn btn-sm btn-outline-warning mb-1" onclick="editInv('${d.row}','${d.nama}',${d.beli},${d.jual},${d.stok},'${d.kategori}')">Edit</button><br>
                  <button class="btn btn-sm btn-outline-danger" onclick="delInv(${d.row})">Del</button>
                </div>
              </div>
            </div>`;
            });
            document.getElementById("inventoryList").innerHTML = html;
            document.getElementById("totalModal").innerText = "Rp " + totalM.toLocaleString();
            document.getElementById("totalStok").innerText = totalS + " Pcs";
          });
      }

      document.getElementById("invForm").onsubmit = (e) => {
        e.preventDefault();
        fetch(scriptURL, { method: "POST", body: new FormData(e.target) }).then(() => {
          Swal.fire("Berhasil", "Data Gudang Update", "success");
          e.target.reset();
          document.getElementById("rowId").value = "";
          loadInv();
        });
      };

      function delInv(row) {
        if (confirm("Hapus part ini?")) {
          fetch(scriptURL + "?action=delete&type=inv&row=" + row).then(() => loadInv());
        }
      }

      function editInv(row, n, b, j, s, k) {
        document.getElementById("rowId").value = row;
        document.getElementById("namaPart").value = n;
        document.getElementById("hargaBeli").value = b;
        document.getElementById("hargaJual").value = j;
        document.getElementById("stok").value = s;
        document.getElementById("kategori").value = k;
        window.scrollTo(0, 0);
      }

      loadInv();
    </script>
  </body>
</html>
